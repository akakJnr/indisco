# Render Blueprint for R'Indisco Supermarket: FREE DEMO setup.
# Everything below uses Render's free plans, so it costs nothing.
# Values marked `sync: false` are secrets or addresses you type into Render;
# nothing secret is stored in this repository. See DEPLOY.md.
#
# Free-plan limits to know about (details in DEPLOY.md):
#  - Web services fall asleep after ~15 minutes without visitors; the next
#    visit waits roughly a minute while they wake up.
#  - The free Postgres database is deleted after 30 days.
#  - Web services have 512 MB of memory, which is tight for Medusa.
#  - No Redis: events and workflows run in memory (fine for a demo, not for
#    production). Setting REDIS_URL turns the Redis modules on.

databases:
  - name: indisco-db
    region: frankfurt # all services share a region so they use the private network
    plan: free
    postgresMajorVersion: "18" # use "17" if 18 is not offered yet
    ipAllowList: [] # private network only; add your IP temporarily to restore data

services:
  # Medusa backend and admin dashboard (the admin is served at /app).
  - type: web
    name: indisco-backend
    runtime: node
    region: frankfurt
    plan: free
    healthCheckPath: /health
    buildCommand: >-
      npm ci &&
      npm run build --workspace=@dtc/backend &&
      cd apps/backend/.medusa/server &&
      npm install
    # Applies database migrations, then starts the server.
    startCommand: >-
      cd apps/backend/.medusa/server &&
      npx medusa db:migrate &&
      npx medusa start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Keeps Node inside the free plan's 512 MB.
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: DATABASE_URL
        fromDatabase:
          name: indisco-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      # Addresses, typed in after the services exist (see DEPLOY.md step 4).
      - key: STORE_CORS
        sync: false
      - key: ADMIN_CORS
        sync: false
      - key: AUTH_CORS
        sync: false
      # Third-party keys.
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # Next.js storefront.
  - type: web
    name: indisco-storefront
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci && npm run build --workspace=@dtc/storefront
    startCommand: cd apps/storefront && npx next start -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_DEFAULT_REGION
        value: ng
      # NEXT_PUBLIC_* values are baked in at build time: change one, redeploy.
      - key: NEXT_PUBLIC_MEDUSA_BACKEND_URL
        sync: false
      - key: NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_BASE_URL
        sync: false
